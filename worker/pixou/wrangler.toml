# Relais IA de Pixou : déployé gratuitement sur Cloudflare Workers (voir README.md).
name = "pixou-chat"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Sites autorisés à appeler le relais (séparés par des virgules). Le réseau local est toujours accepté.
ALLOWED_ORIGINS = "https://edgartucoulat.github.io"
# Modèle Claude utilisé par Pixou.
PIXOU_MODEL = "claude-opus-5-5"

# La clé API n'est JAMAIS écrite ici : c'est un secret Cloudflare
#   npx wrangler secret put ANTHROPIC_API_KEY
