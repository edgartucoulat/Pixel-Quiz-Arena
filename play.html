<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1c2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>PIXEL QUIZ ARENA · Manette</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23e43b44'/><circle cx='8' cy='8' r='5' fill='%23ffcd75'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=23">
  <link rel="stylesheet" href="css/play.css?v=23">
</head>
<body class="play">
  <div id="netbar"></div>
  <header id="me"></header>
  <div id="scores"></div>
  <div id="pixou-say"></div>
  <main id="screen"></main>
  <div id="ownerbar"></div>
  <footer id="cards"></footer>
  <button id="chat-btn" aria-label="Chat">💬<i id="chat-badge"></i></button>
  <div id="chat" aria-hidden="true">
    <div class="chat-head"><b>💬 CHAT</b><span id="chat-ai"></span><button id="chat-close" aria-label="Fermer">✖</button></div>
    <div id="chat-list"></div>
    <div class="chat-emojis" id="chat-emojis"></div>
    <form id="chat-form"><input id="chat-in" maxlength="140" autocomplete="off" placeholder="Écris un message... (Pixou lit tout)"><button>➤</button></form>
  </div>
  <div id="chat-peek"></div>
  <div id="modal"></div>
  <div id="flash"></div>
  <div id="ice"></div>

  <script src="js/vendor/peerjs.min.js?v=23"></script>
  <script src="js/vendor/qrcode.js?v=23"></script>
  <script src="js/common.js?v=23"></script>
  <script src="js/net.js?v=23"></script>
  <script src="js/relay.js?v=23"></script>
  <script src="js/sprites.js?v=23"></script>
  <script src="js/play.js?v=23"></script>
</body>
</html>
